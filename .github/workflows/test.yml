name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: SKILL.mdの形式を検証する
        run: python .github/scripts/validate_skills.py

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # READMEの動作要件（Python 3.10以上）の下限と、最新版の両方で確認する
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: onelogin-access-review
        working-directory: skills/onelogin-access-review
        run: python -m unittest discover -s tests -v
